<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>浏览器扩展</title>
<style>
  /*
    2026-09-28 重构：配色、圆角、间距对齐 App（AppearanceTheme.swift / DesignTokens.swift）。
    原来的米色底 + 橙色主按钮是旧版 App 的「石楠」主题，App 已在 09-23 改为
    中性白底 + 一支蓝，弹窗跟着换成同一套令牌。颜色只在下面两组变量里写。
  */
  :root {
    color-scheme: light dark;
    --canvas: #F6F6F4;        /* App 侧栏底 */
    --card: #FFFFFF;          /* App 阅读区 / 设置卡 */
    --hairline: #E6E6E3;
    --badge: #EDEDEB;
    --ink: #37352F;
    --secondary: #6F6E6A;
    /* 靛青：2026-09-28 App 自有风格取代系统亮蓝，弹窗跟着换（AppearanceTheme.swift ReadingPalette.accent）。 */
    --accent: #2B4C7E;
    --accent-hover: #24416D;
    --accent-pressed: #1E375C;
    --on-accent: #FFFFFF;
    --accent-tint: rgba(43,76,126,.08);
    --accent-line: rgba(43,76,126,.30);
    --success: #486E4A;  --success-tint: rgba(72,110,74,.12);
    --warning: #835E2A;  --warning-tint: rgba(131,94,42,.12);
    --danger:  #A14B42;
    --info:    #416B7B;  --info-tint: rgba(65,107,123,.12);
    --disabled-fill: #EDEDEB; --disabled-text: #A5A4A0;
    --shadow-soft: 0 1px 2px rgba(0,0,0,.05);
    --radius-card: 12px;
    --radius-control: 8px;
    --radius-small: 6px;
    --radius-pill: 999px;
    /* 「汲」收藏印：朱底 + 纸色字（白文），与 App 印章同色。 */
    --seal: #B8321C;
    --seal-paper: #FCFCFB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #1C1C1E;
      --card: #232326;
      --hairline: rgba(255,255,255,.08);
      --badge: rgba(255,255,255,.10);
      --ink: #E3E2DE;
      --secondary: #9B9A96;
      --accent: #8EA8D6;
      --accent-hover: #9DB4DD;
      --accent-pressed: #7F9BCC;
      --on-accent: #0F1A2B;
      --accent-tint: rgba(142,168,214,.12);
      --accent-line: rgba(142,168,214,.35);
      --success: #86B98F;  --success-tint: rgba(134,185,143,.14);
      --warning: #D9B36A;  --warning-tint: rgba(217,179,106,.14);
      --danger:  #D98070;
      --info:    #7FA9BF;  --info-tint: rgba(127,169,191,.14);
      --disabled-fill: rgba(255,255,255,.08); --disabled-text: #6E6D6A;
      --shadow-soft: none;
      --seal: #E07A66;
      --seal-paper: #1D1E21;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); }

  /*
    `hidden` 必须真的能藏住东西。
    浏览器给 `[hidden]` 的 `display:none` 来自 UA 样式表，优先级低于任何 id 选择器——
    而下面 `#send` 和 `#availability` 都设了 display，于是 `element.hidden = true`
    在这两个元素上完全无效。
  */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    width: 380px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 13px;
    background: var(--canvas);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  /* 表单控件默认不继承字体，漏掉这一行的表现是「按钮和正文不是一套字」。 */
  button, input, select, textarea { font-family: inherit; }

  main { padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--canvas); }

  /* 顶部：品牌 + 可用性徽章 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px; }
  .brand { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
  /* 用真图标：弹窗、工具栏、App 三处是同一个标志。 */
  .brand .logo { width: 16px; height: 16px; display: block; }
  /* 顶部状态：一个小点 + 一句话，不再是彩色胶囊（App 的配色里没有绿色）。 */
  #availability {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--secondary); white-space: nowrap;
  }
  #availability::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-sizing: border-box; }
  #availability[data-tone="warn"]::before    { background: var(--warning); }
  #availability[data-tone="blocked"]::before { background: transparent; border: 1px solid var(--secondary); }

  /* 内容卡：与 App 设置卡同一套——白底、1px 细线、12pt 圆角。 */
  .card {
    background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-card); padding: 12px;
    display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-soft);
  }
  /* 标题与正文开头用宋体，和 App 阅读区同一种字（2026-09-29 弹窗重构）。 */
  .serif { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; }
  #platform { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--secondary); }
  #status {
    margin: 0; font-size: 16px; line-height: 1.45; font-weight: 600;
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  #source-card { padding: 14px; gap: 8px; }
  .source-head { display: flex; gap: 12px; align-items: flex-start; }
  .source-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  /* 视频卡左侧的竖版块：封面地址不出后台，这里只放时长。 */
  #video-thumb {
    width: 64px; height: 86px; flex-shrink: 0; border-radius: var(--radius-control);
    background: #2A2A2C; position: relative; display: flex; align-items: center; justify-content: center;
  }
  #video-thumb svg { display: block; }
  #video-duration {
    position: absolute; right: 4px; bottom: 4px; font-size: 10px; color: #FFFFFF;
    background: rgba(0,0,0,.55); padding: 1px 4px; border-radius: 4px;
  }
  #video-duration:empty { display: none; }
  #author { font-size: 12px; color: var(--ink); }
  #excerpt {
    margin: 0; font-size: 13px; line-height: 1.7; color: var(--secondary);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  #stats {
    display: grid; grid-template-columns: repeat(var(--stat-count, 4), minmax(0, 1fr)); gap: 6px;
    border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 2px;
  }
  #stats:empty { display: none; }
  #stats[data-count="2"] { --stat-count: 2; }
  #stats[data-count="3"] { --stat-count: 3; }
  #stats .stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #stats .stat b { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats .stat span { font-size: 11px; color: var(--secondary); }
  #source-note { margin: 0; font-size: 11px; color: var(--secondary); }
  #meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #meta:empty { display: none; }
  #meta .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--secondary);
    background: var(--badge); padding: 2px 7px; border-radius: var(--radius-small);
  }
  #meta .chip.video { background: var(--accent-tint); color: var(--accent); }

  /* 主操作（互斥出现，同一个角色）：App 的强调蓝。 */
  #send, #sync-bookmarks, #sync-selected, #read-x-profile, #recovery-action, #open-app {
    appearance: none; border: 0; border-radius: var(--radius-control); padding: 8px 12px; min-height: 36px;
    font-size: 13px; font-weight: 600; background: var(--accent); color: var(--on-accent);
    cursor: pointer; transition: background 0.12s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    text-align: center; line-height: 1.35; text-decoration: none; flex-shrink: 0;
  }
  #send:hover, #sync-bookmarks:hover, #sync-selected:hover, #read-x-profile:hover, #recovery-action:hover, #open-app:hover { background: var(--accent-hover); }
  #send:active, #sync-bookmarks:active, #sync-selected:active, #read-x-profile:active, #recovery-action:active, #open-app:active { background: var(--accent-pressed); }
  #send:disabled, #sync-bookmarks:disabled, #sync-selected:disabled, #read-x-profile:disabled { background: var(--disabled-fill); color: var(--disabled-text); cursor: default; }
  #send.done, #sync-bookmarks.done, #sync-selected.done, #read-x-profile.done { background: var(--success-tint); color: var(--success); }
  /*
    保存按钮钉在弹窗底部：来源卡、评论预览加起来会超过 Chromium 弹窗 600px 的上限，
    主操作不能跟着滚出视线（2026-09-29 实测视频页要往下滚才看得到「保存」）。
  */
  #send:not([hidden]) {
    position: sticky; bottom: 12px; z-index: 1;
    box-shadow: 0 0 0 12px var(--canvas);
  }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }

  /*
    收藏页必须一开始就按 Chromium 弹窗上限开满。只在读完列表后加高，
    窗口往往不再长高，底部「同步所选」会被裁掉，点了也看不见报错。
  */
  html.bookmarks-popup,
  html.bookmarks-popup body {
    width: 380px;
    min-height: 600px;
    max-height: 600px;
    overflow: hidden;
  }
  html.bookmarks-popup body { display: flex; }
  html.bookmarks-popup main {
    flex: 1 1 auto; min-height: 0; max-height: none; overflow: hidden; gap: 8px; padding: 12px;
  }
  html.bookmarks-popup .diag { display: none; }
  html.bookmarks-popup #error { flex-shrink: 0; order: 5; }
  html.bookmarks-popup #result { flex-shrink: 0; order: 6; }
  html.bookmarks-popup #sync-bookmarks { flex-shrink: 0; }
  html.bookmarks-popup #sync-selected { flex-shrink: 0; order: 7; }
  html.bookmarks-popup #bookmarks-picker { order: 4; }

  /* 勾选列表（收藏夹与评论共用）：白卡内平铺行，勾选行用强调色淡底。 */
  #bookmarks-picker, #comments-picker {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-card);
    padding: 8px; min-height: 0; box-shadow: var(--shadow-soft);
  }
  #bookmarks-picker { flex: 1 1 auto; overflow: hidden; }
  .picker-toolbar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex-shrink: 0; padding: 0 4px; }
  #picker-count, #comments-count { flex: 1; font-size: 12px; color: var(--ink); font-weight: 600; min-width: 90px; }
  .picker-toolbar button {
    appearance: none; border: 0; border-radius: var(--radius-small); padding: 3px 8px;
    font-size: 11.5px; font-weight: 500; background: transparent; color: var(--accent); cursor: pointer;
  }
  .picker-toolbar button:hover { background: var(--accent-tint); }
  #picker-list, #comments-list {
    overflow: auto; display: flex; flex-direction: column; gap: 2px;
    min-height: 0; padding-right: 2px;
  }
  #picker-list { flex: 1 1 auto; max-height: none; }
  /* 弹窗最高 600px：评论列表再高，「保存」按钮就被挤出可视区。 */
  #comments-list { max-height: 196px; }
  #comments-list:empty { display: none; }
  #sync-selected { flex-shrink: 0; }
  .bookmark-card {
    display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start;
    padding: 7px 8px; border-radius: var(--radius-control);
    border: 1px solid transparent; cursor: pointer;
  }
  .bookmark-card:hover { background: var(--badge); }
  .bookmark-card.is-checked { background: var(--accent-tint); }
  .bookmark-card.is-synced { opacity: 0.7; }
  .bookmark-card input { margin: 2px 0 0; accent-color: var(--accent); }
  .bookmark-card .author {
    font-size: 12px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .bookmark-card .badge {
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: var(--radius-pill);
    background: var(--badge); color: var(--secondary);
  }
  .bookmark-card .snippet {
    margin: 2px 0 0; font-size: 12px; line-height: 1.45; color: var(--secondary);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  #comments-list .bookmark-card.is-reply { margin-left: 16px; }
  #comments-list .likes { font-weight: 500; color: var(--secondary); font-size: 11px; }
  #comments-note { margin: 0; padding: 0 4px; font-size: 11px; line-height: 1.45; color: var(--secondary); }
  #comments-note:empty { display: none; }

  /* 保存后：分段控件，选中的一段用靛青实底（和 App 设置里的分段一致）。 */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 2px; }
  .section-head h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink); }
  .section-head .hint { font-size: 11px; color: var(--secondary); }
  .action-card { padding: 12px 14px; gap: 8px; }
  .action-options {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    padding: 2px; border-radius: var(--radius-control); background: var(--badge);
  }
  .action-option { position: relative; }
  .action-option input { position: absolute; opacity: 0; pointer-events: none; }
  .action-option span {
    display: flex; align-items: center; justify-content: center;
    min-height: 28px; padding: 3px 5px; border-radius: var(--radius-small); text-align: center;
    color: var(--ink); font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .action-option input:checked + span { color: var(--on-accent); background: var(--accent); font-weight: 600; }
  .action-option input:focus-visible + span { outline: 2px solid var(--accent-line); outline-offset: 1px; }
  #action-detail { margin: 0; color: var(--secondary); font-size: 12px; line-height: 1.5; }

  /*
    工序印：图片由 App 的 SealMark 渲染导出（public/seals，见 ExtensionSealAssetTests），
    和 App 同一套画法，小印不另画简化版。
  */
  .seal-img { display: block; width: 34px; height: 34px; }
  .seal-img img { display: block; width: 100%; height: 100%; }
  #step-chain { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
  .chain-seal {
    appearance: none; border: 0; background: transparent; padding: 2px 0; margin: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font: inherit; font-size: 11px; color: var(--ink); border-radius: var(--radius-small);
  }
  button.chain-seal { cursor: pointer; }
  button.chain-seal:hover { background: var(--accent-tint); }
  .chain-seal.pending { color: var(--secondary); }
  .chain-seal.na { color: var(--secondary); }
  .chain-seal.na .seal-img { opacity: .3; filter: grayscale(1); }
  .step-rows { display: flex; flex-direction: column; gap: 8px; }
  .step-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
  .step-row .seal-img { width: 24px; height: 24px; }
  .step-row .state { font-size: 11px; color: var(--secondary); text-align: right; }
  .step-row.running .state { color: var(--accent); }
  .step-row.failed .state { color: var(--danger); }
  .step-row.waiting, .step-row.manual { color: var(--secondary); }
  #saved-steps { align-self: stretch; text-align: left; border-top: 1px solid var(--hairline); padding-top: 12px; margin-top: 2px; }
  #dup-view { padding: 12px 14px; gap: 10px; }
  #dup-title { color: var(--accent); }
  #save-again {
    appearance: none; border: 1px solid var(--hairline); border-radius: var(--radius-control); min-height: 36px;
    font-size: 13px; background: var(--card); color: var(--ink); cursor: pointer;
  }
  #save-again:hover { background: var(--badge); }

  /* 评论卡：自动保存时只读预览前几条；勾选模式是带复选框的列表。 */
  #comments-picker .comments-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 4px; }
  #comments-mode {
    appearance: none; border: 0; background: transparent; padding: 0; cursor: pointer;
    font-size: 11px; color: var(--accent);
  }
  .comment-preview { display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 2px; }
  .comment-preview .who { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--secondary); }
  .comment-preview .what {
    font-size: 12px; line-height: 1.5; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #comments-more { margin: 0; padding: 0 4px; font-size: 11px; color: var(--secondary); }
  #comments-more:empty { display: none; }

  /* 保存成功 / 读不到：各自一张结果卡，替换掉来源卡下面的内容。 */
  #saved-view { align-items: center; text-align: center; padding: 20px 14px 16px; gap: 10px; }
  #saved-view .collector-seal { width: 56px; height: 56px; }
  #saved-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
  #saved-detail { margin: 0; font-size: 12px; line-height: 1.6; color: var(--secondary); white-space: pre-line; }
  #failure-view { padding: 14px; gap: 6px; }
  #failure-title { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink); }
  #failure-message { margin: 0; font-size: 12px; line-height: 1.6; color: var(--secondary); }
  #failure-steps { margin: 6px 0 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 6px; }
  #failure-steps li { counter-increment: step; display: grid; grid-template-columns: 14px 1fr; gap: 8px; font-size: 12px; line-height: 1.5; }
  #failure-steps li::before { content: counter(step); color: var(--secondary); }
  #failure-steps:empty { display: none; }
  .button-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
  .button-row > [hidden] { display: none !important; }
  #close-popup {
    appearance: none; border: 1px solid var(--hairline); border-radius: var(--radius-control); min-height: 36px;
    font-size: 13px; background: var(--card); color: var(--ink); cursor: pointer;
  }
  #close-popup:hover { background: var(--badge); }
  #result { margin: 0; padding: 8px 12px; border-radius: var(--radius-control); background: var(--success-tint); color: var(--success); font-size: 12px; line-height: 1.45; }
  #result { display: flex; align-items: center; gap: 10px; }
  /* 保存成功时盖下的「汲」印：从大、透明压到略小再回弹到原大。 */
  .collector-seal {
    flex-shrink: 0; width: 40px; height: 40px; display: inline-block;
    color: var(--seal); transform: rotate(-1deg);
    animation: collector-seal-press 0.32s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .collector-seal svg { display: block; }
  @keyframes collector-seal-press {
    from { transform: rotate(-1deg) scale(1.35); opacity: 0; }
    55%  { transform: rotate(-1deg) scale(.94); opacity: 1; }
    to   { transform: rotate(-1deg) scale(1); opacity: 1; }
  }
  /* 减弱动效：不压印，章直接出现在最终位置。 */
  @media (prefers-reduced-motion: reduce) {
    .collector-seal { animation: none; }
  }

  #error {
    margin: 0; padding: 0 2px; font-size: 12px; line-height: 1.45; color: var(--danger);
    white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit;
  }
  #error:empty { display: none; }

  /* 诊断：默认折叠，仅调试用 */
  .diag > summary {
    list-style: none; cursor: pointer; font-size: 10.5px; color: var(--secondary);
    display: inline-flex; align-items: center; gap: 4px; padding-left: 2px;
  }
  .diag > summary::-webkit-details-marker { display: none; }
  .diag > summary::before { content: "\25B8"; font-size: 8px; }
  .diag[open] > summary::before { content: "\25BE"; }
  #metadata-diagnostic {
    margin: 8px 0 0; padding: 8px 10px;
    font: 10.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--secondary); background: var(--card); border: 1px solid var(--hairline); border-radius: var(--radius-control);
    max-height: 120px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #metadata-diagnostic:empty { display: none; }
  #build-label { margin: 6px 0 0; font-size: 10px; color: var(--secondary); padding-left: 2px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <header class="brand">
      <img class="logo" src="/icon/48.png" alt="">
      <span id="extension-name">浏览器扩展</span>
    </header>
    <span id="availability" data-tone="ready" hidden></span>
  </div>
  <section class="card" id="source-card">
    <div class="source-head">
      <div id="video-thumb" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <span id="video-duration"></span>
      </div>
      <div class="source-text">
        <div id="platform"></div>
        <h1 id="status" class="serif">读取当前页面…</h1>
        <div id="author" hidden></div>
      </div>
    </div>
    <p id="excerpt" class="serif" hidden></p>
    <div id="meta"></div>
    <div id="stats"></div>
    <p id="source-note" hidden>用了浏览器里的登录状态读取</p>
  </section>
  <section class="card" id="dup-view" hidden>
    <div class="section-head"><h2 id="dup-title">这一页已经在汲作里</h2><span class="hint" id="dup-date"></span></div>
    <div class="step-rows" id="dup-steps"></div>
  </section>
  <section class="card action-card" id="action-card">
    <div class="section-head"><h2>保存后</h2></div>
    <div id="step-chain" role="group" aria-label="保存后的工序"></div>
    <p id="action-detail"></p>
  </section>
  <section class="card" id="saved-view" hidden>
    <span id="saved-seal"></span>
    <h1 id="saved-title" class="serif"></h1>
    <p id="saved-detail"></p>
    <div class="step-rows" id="saved-steps" hidden></div>
  </section>
  <section class="card" id="failure-view" hidden>
    <h2 id="failure-title"></h2>
    <p id="failure-message"></p>
    <ol id="failure-steps"></ol>
  </section>
  <!--
    初始必须 disabled：main.ts 用顶层 await 等预览返回，`send.onclick` 在那之后才
    挂上。抖音的 session detail 最长 5s、YouTube 还要切字幕轨，这几秒里按钮是可点的
    但没有任何监听者——用户点下去不变灰、不报错、不发送，只能以为是自己没点中。
  -->
  <section id="comments-picker" hidden>
    <div class="picker-toolbar">
      <span id="comments-count">正在加载评论…</span>
      <button type="button" id="comments-mode" hidden>逐条挑选</button>
      <button type="button" id="comments-select-all">全选</button>
      <button type="button" id="comments-select-none">清空</button>
    </div>
    <div id="comments-list"></div>
    <p id="comments-more"></p>
    <p id="comments-note"></p>
  </section>
  <button id="send" disabled>准备中…</button>
  <div class="button-row" id="result-actions" hidden>
    <button type="button" id="close-popup">关闭</button>
    <button type="button" id="save-again" hidden>再存一份</button>
  </div>
  <button id="sync-bookmarks" hidden>读取收藏列表</button>
  <section id="bookmarks-picker" hidden>
    <div class="picker-toolbar">
      <span id="picker-count">已选 0 / 0</span>
      <button type="button" id="picker-select-new">选未同步</button>
      <button type="button" id="picker-select-all">全选</button>
      <button type="button" id="picker-select-none">清空</button>
    </div>
    <div id="picker-list"></div>
  </section>
  <button id="sync-selected" hidden disabled>同步所选到汲作</button>
  <button id="read-x-profile" hidden>读取主页作品到汲作</button>
  <p id="result" hidden></p>
  <button id="recovery-action" hidden></button>
  <a id="open-app" href="linkdigest://open" hidden>打开汲作查看</a>
  <pre id="error"></pre>
  <details class="diag" id="diag" hidden>
    <summary>诊断信息</summary>
    <pre id="metadata-diagnostic"></pre>
    <p id="build-label"></p>
  </details>
  <script type="module" src="./main.ts"></script>
</main>
</body>
</html>
