<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>浏览器扩展</title>
<style>
  :root {
    color-scheme: light dark;
    --radius-card: 12px;
    --radius-control: 10px;
    --radius-small: 8px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html { background: transparent; }

  /*
    `hidden` 必须真的能藏住东西。
    浏览器给 `[hidden]` 的 `display:none` 来自 UA 样式表，优先级低于任何 id 选择器——
    而下面 `#send` 和 `#availability` 都设了 display，于是 `element.hidden = true`
    在这两个元素上完全无效。X 收藏夹页面就是这么多出一个「准备中…」大灰块的：
    代码明明把它藏了。
  */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    width: 340px;
    padding: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: transparent;
    color: #2e2925;
    -webkit-font-smoothing: antialiased;
  }
  /* 表单控件默认不继承字体，漏掉这一行的表现是「按钮和正文不是一套字」。 */
  button, input, select, textarea { font-family: inherit; }

  main {
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    background: #f4f0e8;
    border: 1px solid rgba(93,77,62,.12);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(46,41,37,.14);
  }

  /* 顶部：品牌 + 可用性徽章 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: #86868b; }
  /* 用真图标而不是渐变方块里放个字母：弹窗、工具栏、App 三处才是同一个标志。 */
  .brand .logo { width: 18px; height: 18px; display: block; }
  #availability {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); white-space: nowrap;
  }
  #availability::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
  #availability[data-tone="ready"]   { background: rgba(48,209,88,0.15); color: #248a3d; }
  #availability[data-tone="ready"]::before { background: #34c759; }
  #availability[data-tone="video"]   { background: rgba(10,132,255,0.15); color: #0060df; }
  #availability[data-tone="video"]::before { background: #0a84ff; }
  #availability[data-tone="warn"]    { background: rgba(255,159,10,0.18); color: #b25000; }
  #availability[data-tone="warn"]::before { background: #ff9f0a; }
  #availability[data-tone="blocked"] { background: rgba(142,142,147,0.18); color: #6e6e73; }
  #availability[data-tone="blocked"]::before { background: #8e8e93; }

  /* 内容卡：圆角白卡浮在灰底上 */
  .card {
    background: #fffdf8; border: 1px solid rgba(93,77,62,0.10); border-radius: var(--radius-card); padding: 13px 14px;
    display: flex; flex-direction: column; gap: 7px;
    box-shadow: 0 1px 1px rgba(46,41,37,0.035);
  }
  #platform { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #86868b; }
  #status {
    margin: 0; font-size: 15px; line-height: 1.4; font-weight: 700; letter-spacing: -0.1px;
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #meta:empty { display: none; }
  #meta .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; color: #86868b;
    background: #f2f2f7; padding: 3px 8px; border-radius: var(--radius-small);
  }
  #meta .chip.video { background: rgba(10,132,255,0.1); color: #0060df; }

  /*
    两个按钮是**互斥**的（普通页面用 #send，X 收藏夹页面用 #sync-bookmarks），
    所以它们是同一个角色，共用一套样式。原来只给 #send 写了样式，
    #sync-bookmarks 是个裸 button，于是收藏夹页面上主操作反而长得像次要按钮。
  */
  #send, #sync-bookmarks, #recovery-action, #open-app {
    appearance: none; border: 0; border-radius: var(--radius-control); padding: 10px 12px; min-height: 44px;
    font-size: 13.5px; font-weight: 650; background: #c56f49; color: #ffffff;
    cursor: pointer; transition: background 0.15s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    text-align: center; line-height: 1.35; text-decoration: none;
  }
  #send:hover, #sync-bookmarks:hover, #recovery-action:hover, #open-app:hover { background: #ae5d3c; }
  #send:active, #sync-bookmarks:active, #recovery-action:active, #open-app:active { background: #934a31; }
  #send:disabled, #sync-bookmarks:disabled { background: #d1d1d6; color: #8e8e93; cursor: default; }
  #send.done, #sync-bookmarks.done { background: rgba(48,209,88,0.16); color: #248a3d; }

  .action-card { padding: 5px; gap: 6px; }
  .action-options {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    padding: 3px; border-radius: 11px; background: #f2eee7;
  }
  .action-option { position: relative; }
  .action-option input { position: absolute; opacity: 0; pointer-events: none; }
  .action-option span {
    display: flex; align-items: center; justify-content: center;
    min-height: 36px; padding: 6px 5px; border-radius: var(--radius-small); text-align: center;
    color: #746b63; font-size: 12px; font-weight: 650; cursor: pointer;
  }
  .action-option input:checked + span {
    color: #934a31; background: #fffdf8;
    box-shadow: 0 1px 3px rgba(46,41,37,.08), inset 0 0 0 1px rgba(197,111,73,.16);
  }
  .action-option input:focus-visible + span { outline: 2px solid rgba(197,111,73,.55); outline-offset: 1px; }
  #action-detail { margin: 2px 8px 5px; color: #746b63; font-size: 11.5px; line-height: 1.45; }
  #result { margin: 0; padding: 10px 12px; border-radius: 11px; background: #edf6ed; color: #28713b; font-size: 12px; line-height: 1.45; }

  #error {
    margin: 0; font-size: 12px; line-height: 1.45; color: #d70015;
    white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit;
  }
  #error:empty { display: none; }

  /* 诊断：默认折叠，仅调试用 */
  .diag > summary {
    list-style: none; cursor: pointer; font-size: 10.5px; color: #aeaeb2;
    display: inline-flex; align-items: center; gap: 4px; padding-left: 2px;
  }
  .diag > summary::-webkit-details-marker { display: none; }
  .diag > summary::before { content: "\25B8"; font-size: 8px; }
  .diag[open] > summary::before { content: "\25BE"; }
  #metadata-diagnostic {
    margin: 8px 0 0; padding: 9px 11px;
    font: 10.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: #6e6e73; background: #ffffff; border-radius: 9px;
    max-height: 120px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #metadata-diagnostic:empty { display: none; }
  #build-label { margin: 6px 0 0; font-size: 10px; color: #aeaeb2; padding-left: 2px; }

  @media (prefers-color-scheme: dark) {
    body { background: transparent; color: #f5f0e9; }
    main { background: #211e1b; border-color: rgba(255,255,255,.08); box-shadow: 0 6px 22px rgba(0,0,0,.34); }
    .brand { color: #98989d; }
    .card { background: #2d2925; border-color: rgba(255,255,255,.06); box-shadow: none; }
    #platform { color: #98989d; }
    #meta .chip { background: #3a3a3c; color: #aeaeb2; }
    #send, #sync-bookmarks, #recovery-action, #open-app { background: #d77b55; color: #fff; }
    #send:hover, #sync-bookmarks:hover, #recovery-action:hover, #open-app:hover { background: #e48a63; }
    #send:disabled, #sync-bookmarks:disabled { background: #3a3a3c; color: #8e8e93; }
    #send.done, #sync-bookmarks.done { background: rgba(48,209,88,0.2); color: #30d158; }
    #metadata-diagnostic { color: #98989d; background: #1c1c1e; }
    #build-label { color: #636366; }
    .action-options { background: #24211e; }
    .action-option span { color: #aaa19a; }
    .action-option input:checked + span {
      color: #f1b196; background: #39332e;
      box-shadow: 0 1px 3px rgba(0,0,0,.22), inset 0 0 0 1px rgba(215,123,85,.18);
    }
    #action-detail { color: #aaa19a; }
    #result { background: rgba(48,209,88,.13); color: #65d47c; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <header class="brand">
      <img class="logo" src="/icon/48.png" alt="">
      <span id="extension-name">浏览器扩展</span>
    </header>
    <span id="availability" data-tone="ready" hidden></span>
  </div>
  <div class="card">
    <div id="platform"></div>
    <h1 id="status">读取当前页面…</h1>
    <div id="meta"></div>
  </div>
  <section class="card action-card" id="action-card">
    <div class="action-options" role="radiogroup" aria-label="发送后操作">
      <label class="action-option"><input type="radio" name="capture-action" value="save" checked><span>仅保存</span></label>
      <label class="action-option"><input type="radio" name="capture-action" value="summarize"><span>总结</span></label>
      <label class="action-option"><input type="radio" name="capture-action" value="translate"><span>翻译</span></label>
    </div>
    <p id="action-detail">保留原文与来源，稍后再处理</p>
  </section>
  <!--
    初始必须 disabled：main.ts 用顶层 await 等预览返回，`send.onclick` 在那之后才
    挂上。抖音的 session detail 最长 5s、YouTube 还要切字幕轨，这几秒里按钮是可点的
    但没有任何监听者——用户点下去不变灰、不报错、不发送，只能以为是自己没点中。
  -->
  <button id="send" disabled>准备中…</button>
  <button id="sync-bookmarks" hidden>同步收藏夹到桌面 App</button>
  <p id="result" hidden></p>
  <button id="recovery-action" hidden></button>
  <a id="open-app" href="linkdigest://open" hidden>打开汲作查看</a>
  <pre id="error"></pre>
  <details class="diag" id="diag" hidden>
    <summary>诊断信息</summary>
    <pre id="metadata-diagnostic"></pre>
    <p id="build-label"></p>
  </details>
  <script type="module" src="./main.ts"></script>
</main>
</body>
</html>
