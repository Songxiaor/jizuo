<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>浏览器扩展</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #ffffff;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  main { padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .brand {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; color: #86868b;
  }
  .brand img { width: 18px; height: 18px; border-radius: 4px; }
  #status {
    margin: 0;
    font-size: 15px; line-height: 1.4; font-weight: 700;
    letter-spacing: -0.1px;
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .props {
    display: flex; flex-direction: column; gap: 6px;
    padding: 9px 0;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }
  .props p { margin: 0; font-size: 12px; line-height: 1.45; color: #6e6e73; }
  .props p:empty { display: none; }
  #metadata-diagnostic {
    margin: 0; padding: 8px 10px;
    font: 10.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: #6e6e73; background: rgba(0, 0, 0, 0.04);
    border-radius: 6px; max-height: 96px; overflow: auto;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #send {
    appearance: none; border: 0; border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px; font-weight: 600;
    background: #1d1d1f; color: #ffffff;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #send:hover { background: #3a3a3c; }
  #send:active { background: #000000; }
  #send:disabled { opacity: 0.4; cursor: default; }
  #error {
    margin: 0; font-size: 12px; line-height: 1.45;
    color: #d70015; white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: inherit;
  }
  #error:empty { display: none; }
  #build-label { margin: 0; font-size: 10px; color: #aeaeb2; }
  @media (prefers-color-scheme: dark) {
    body { background: #1f1f21; color: #f2f2f4; }
    .brand { color: #98989d; }
    .props { border-color: rgba(255, 255, 255, 0.1); }
    .props p { color: #98989d; }
    #metadata-diagnostic { color: #98989d; background: rgba(255, 255, 255, 0.06); }
    #send { background: #f5f5f7; color: #111113; }
    #send:hover { background: #ffffff; }
    #build-label { color: #636366; }
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img src="/icon/32.png" alt="">
    <span id="extension-name">浏览器扩展</span>
  </header>
  <h1 id="status">读取当前页面…</h1>
  <div class="props">
    <p id="count"></p>
    <p id="media-status"></p>
  </div>
  <pre id="metadata-diagnostic" hidden></pre>
  <button id="send">发送到桌面 App</button>
  <pre id="error"></pre>
  <p id="build-label"></p>
  <script type="module" src="./main.ts"></script>
</main>
</body>
</html>
