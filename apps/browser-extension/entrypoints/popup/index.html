<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>浏览器扩展</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 328px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #ffffff;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  main { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px; }

  /* 顶部：品牌 + 可用性徽章 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: #86868b; }
  .brand img { width: 18px; height: 18px; border-radius: 4px; }
  #availability {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  #availability::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
  #availability[data-tone="ready"] { background: rgba(48,209,88,0.14); color: #248a3d; }
  #availability[data-tone="ready"]::before { background: #34c759; }
  #availability[data-tone="video"] { background: rgba(10,132,255,0.14); color: #0060df; }
  #availability[data-tone="video"]::before { background: #0a84ff; }
  #availability[data-tone="warn"] { background: rgba(255,159,10,0.16); color: #b25000; }
  #availability[data-tone="warn"]::before { background: #ff9f0a; }
  #availability[data-tone="blocked"] { background: rgba(142,142,147,0.16); color: #6e6e73; }
  #availability[data-tone="blocked"]::before { background: #8e8e93; }

  /* 内容卡 */
  .card { display: flex; flex-direction: column; gap: 6px; }
  #platform { font-size: 11px; font-weight: 600; color: #86868b; letter-spacing: 0.2px; }
  #status {
    margin: 0; font-size: 15px; line-height: 1.4; font-weight: 700; letter-spacing: -0.1px;
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #scale { margin: 0; font-size: 12px; color: #6e6e73; }
  #media-status { margin: 0; font-size: 12px; color: #6e6e73; }
  #media-status:empty { display: none; }

  #send {
    appearance: none; border: 0; border-radius: 9px; padding: 11px 12px;
    font-size: 13px; font-weight: 600; background: #1d1d1f; color: #ffffff;
    cursor: pointer; transition: background 0.15s ease;
  }
  #send:hover { background: #3a3a3c; }
  #send:active { background: #000000; }
  #send:disabled { opacity: 0.4; cursor: default; }
  #send.done { background: rgba(48,209,88,0.16); color: #248a3d; }

  #error {
    margin: 0; font-size: 12px; line-height: 1.45; color: #d70015;
    white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit;
  }
  #error:empty { display: none; }

  /* 诊断：默认折叠，仅调试用 */
  .diag { border-top: 1px solid rgba(0,0,0,0.07); padding-top: 8px; }
  .diag > summary {
    list-style: none; cursor: pointer; font-size: 10.5px; color: #aeaeb2;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .diag > summary::-webkit-details-marker { display: none; }
  .diag > summary::before { content: "\25B8"; font-size: 8px; }
  .diag[open] > summary::before { content: "\25BE"; }
  #metadata-diagnostic {
    margin: 8px 0 0; padding: 8px 10px;
    font: 10.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: #6e6e73; background: rgba(0,0,0,0.04); border-radius: 6px;
    max-height: 120px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #metadata-diagnostic:empty { display: none; }
  #build-label { margin: 4px 0 0; font-size: 10px; color: #aeaeb2; }

  @media (prefers-color-scheme: dark) {
    body { background: #1f1f21; color: #f2f2f4; }
    .brand { color: #98989d; }
    #platform { color: #98989d; }
    #scale, #media-status { color: #98989d; }
    .diag { border-color: rgba(255,255,255,0.09); }
    #metadata-diagnostic { color: #98989d; background: rgba(255,255,255,0.06); }
    #send { background: #f5f5f7; color: #111113; }
    #send:hover { background: #ffffff; }
    #send.done { background: rgba(48,209,88,0.2); color: #30d158; }
    #build-label { color: #636366; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <header class="brand">
      <img src="/icon/32.png" alt="">
      <span id="extension-name">浏览器扩展</span>
    </header>
    <span id="availability" data-tone="ready" hidden></span>
  </div>
  <div class="card">
    <div id="platform"></div>
    <h1 id="status">读取当前页面…</h1>
    <p id="scale"></p>
    <p id="media-status"></p>
  </div>
  <button id="send">发送到桌面 App</button>
  <pre id="error"></pre>
  <details class="diag" id="diag" hidden>
    <summary>诊断信息</summary>
    <pre id="metadata-diagnostic"></pre>
    <p id="build-label"></p>
  </details>
  <script type="module" src="./main.ts"></script>
</main>
</body>
</html>
