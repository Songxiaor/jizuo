name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare project verification tools
        run: bash ./scripts/prepare-ci-tools.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check:web

  verify-macos:
    # 必须是带 macOS 26 SDK 的镜像。App 用了 SpeechTranscriber（本机视频转写），
    # 那是 macOS 26 才有的类型。代码本身没问题：部署下限仍是 macOS 15，功能由
    # `@available(macOS 26.0, *)` 在运行时门控——但 available 只管运行时，
    # 老 SDK 里这个类型压根不存在，编译期就是 "cannot find type in scope"。
    #
    # 用 macos-15 时这个 job 从来没编译成功过，而本机（Xcode 26）一直是绿的。
    # 也别换成 macos-latest：那个标签会跟着 GitHub 换镜像漂，构建会在没有任何
    # 代码改动的情况下突然红或绿。
    runs-on: macos-26
    # 20 分钟是「swift test 从来没在 CI 上跑起来过」那个年代定的。第一次真跑就
    # 是 1299 条、17.4 分钟，加上 debug + release 两次构建直接撞上限被掐断。
    # 那次里有 16.7 分钟耗在一条查不存在字体的测试上，已经修掉；余量留够，
    # 但不设得太宽——真卡住时应当尽早失败，而不是空转一小时。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare project verification tools
        run: bash ./scripts/prepare-ci-tools.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify vertical slice
        run: pnpm check

      - name: Verify Xcode schemes
        run: pnpm xcode:build
